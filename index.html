<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A free Markdown writing app with autocorrect and autocomplete that run in your browser and keep working in airplane mode. No account, nothing you type leaves your device." />
    <link rel="canonical" href="https://offlinepage.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="offline.page" />
    <meta property="og:url" content="https://offlinepage.app/" />
    <meta property="og:title" content="offline.page: a writing app that works in airplane mode" />
    <meta property="og:description" content="Autocorrect and autocomplete from two tiny models that run in your browser tab. No account, nothing you type leaves your device." />
    <meta property="og:image" content="https://offlinepage.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="offline.page. Writes with you, even in airplane mode." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="offline.page: a writing app that works in airplane mode" />
    <meta name="twitter:description" content="Autocorrect and autocomplete from two tiny models that run in your browser tab. No account, nothing you type leaves your device." />
    <meta name="twitter:image" content="https://offlinepage.app/og.png" />
    <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>offline.page: a writing app with autocorrect that works offline</title>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebApplication","name":"offline.page","url":"https://offlinepage.app/","description":"A Markdown writing app with autocorrect and autocomplete that run in your browser and keep working offline.","applicationCategory":"ProductivityApplication","operatingSystem":"Any","browserRequirements":"Requires JavaScript and WebAssembly","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"image":"https://offlinepage.app/og.png"}
    </script>
    <!-- Sets the sidebar and theme before the first paint, so the page doesn't shift or flash while the app loads. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("preload");
        var open = !matchMedia("(max-width: 899px)").matches;
        try {
          if (localStorage.getItem("offline.page/sidebar") === "closed") open = false;
          var theme = localStorage.getItem("offline.page/theme");
          if (theme === "light" || theme === "dark") root.dataset.theme = theme;
          // Someone with saved pages gets their own page, so the built-in welcome page stays hidden.
          if (localStorage.getItem("offline.page/docs")) root.dataset.returning = "";
        } catch (error) {}
        root.dataset.sidebar = open ? "open" : "closed";
      })();
    </script>
  </head>
  <body>
    <aside id="sidebar" class="sidebar" aria-label="Pages and models">
      <div class="flex items-center justify-between">
        <span class="side-brand">offline<i>.page</i></span>
        <span class="ml-auto"></span>
        <button class="side-icon more-button" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.1" /><circle cx="8" cy="8" r="1.1" /><circle cx="12.5" cy="8" r="1.1" /></svg></button>
        <button id="sidebar-close" class="side-icon" type="button" aria-label="Hide the sidebar" title="Hide the sidebar (⌘\)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2.5" /><path d="M6.5 2.5v11" /></svg>
        </button>
      </div>
      <p class="side-tagline">a notebook that works offline</p>

      <p class="side-caption">Contents</p>
      <ol id="pages" class="pages"></ol>
      <button id="new-page" class="new-page" type="button">+ a new page</button>

      <div class="min-h-6 flex-1"></div>

      <div class="models" role="group" aria-label="On-device models">
        <button id="toggle-tinyfix" class="model" type="button" role="switch" aria-checked="true">
          <span class="model-n">01</span><span class="model-name">tiny<i class="text-context">fix</i></span><span class="leader"></span><span class="pill"></span>
        </button>
        <button id="toggle-tinynext" class="model" type="button" role="switch" aria-checked="true">
          <span class="model-n">02</span><span class="model-name">tiny<i class="opacity-55">next</i></span><span class="leader"></span><span class="pill"></span>
        </button>
        <button id="toggle-capitals" class="model" type="button" role="switch" aria-checked="true">
          <span class="model-n">03</span><span class="model-name">capitals</span><span class="leader"></span><span class="pill"></span>
        </button>
      </div>
      <div class="side-foot">
        <span id="models-status" class="group inline-flex min-w-0 items-center gap-1.5 data-[error]:text-error">
          <i class="size-1.5 flex-none rounded-full bg-faint group-data-[ready]:bg-ok group-data-[error]:bg-error"></i><span id="model-status" class="truncate">Loading models…</span>
        </span>
        <a class="flex-none hover:text-sub" href="https://huggingface.co/paperweight" target="_blank" rel="noopener">🤗 Hugging Face ↗</a>
      </div>
    </aside>

    <!-- Shown instead of the sidebar when it's hidden on a wide screen: the closed notebook's spine. -->
    <div id="spine" class="spine">
      <button id="sidebar-open-spine" class="side-icon" type="button" aria-label="Show the sidebar" title="Show the sidebar (⌘\)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2.5" /><path d="M6.5 2.5v11" /></svg>
      </button>
      <button class="side-icon more-button" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.1" /><circle cx="8" cy="8" r="1.1" /><circle cx="12.5" cy="8" r="1.1" /></svg></button>
      <span class="spine-title">offline<i>.page</i></span>
      <span class="spine-dots" aria-hidden="true"><i id="spine-tinyfix"></i><i id="spine-tinynext"></i><i id="spine-capitals"></i></span>
    </div>
    <div id="backdrop" class="backdrop"></div>
    <div id="more-menu" class="menu" role="menu" hidden>
      <button id="export" class="menu-item" type="button" role="menuitem">Export as Markdown</button>
      <button id="copy" class="menu-item" type="button" role="menuitem">Copy Markdown</button>
      <button id="theme" class="menu-item" type="button" role="menuitem">Dark mode</button>
    </div>

    <div id="shell" class="shell flex min-h-dvh flex-col">
      <header class="flex items-center px-4 pt-4 min-[900px]:hidden">
        <button id="sidebar-open" class="side-icon" type="button" aria-label="Show pages">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2.5" /><path d="M6.5 2.5v11" /></svg>
        </button>
      </header>

      <main class="mx-auto w-full max-w-[712px] flex-1 px-4 pt-6 pb-30 sm:pt-[96px]">
        <div class="mb-[22px] flex min-h-5 items-center gap-2 text-[13px] tracking-[0.01em] text-faint">
          <span id="meta"></span>
          <span id="save-chip" class="group inline-flex items-center gap-1.5 data-[error]:text-error" title="Saved on this device">
            <i class="size-1.5 flex-none rounded-full bg-ok group-data-[busy]:bg-faint group-data-[error]:bg-error"></i><span id="save-status" class="hidden group-data-[busy]:inline group-data-[error]:inline">Saved</span>
          </span>
        </div>
        <div id="editor"><!--welcome--></div>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
