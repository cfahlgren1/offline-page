<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="dither.js"></script>
    <link rel="stylesheet" href="brand.css" />
    <style>
      /* The model cards' "what it does" picture: a sentence as the app shows it after its fixes, with what was typed above each. */
      :root {
        --blue: #0066cc;
        --blue-line: rgb(0 102 204 / 0.45);
      }
      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 56px 26px;
        text-align: center;
      }
      .w {
        text-decoration: underline;
        text-decoration-thickness: 2.5px;
        text-underline-offset: 7px;
        text-decoration-color: var(--purple-line);
      }
      .w.sp {
        text-decoration-color: var(--blue-line);
      }
      .rows .typed.solid {
        color: var(--body);
      }
      .ghost {
        color: var(--ghost);
      }
      .rows .key {
        margin-left: 12px;
        vertical-align: 0.3em;
      }
      /* What you type, then what you get. */
      .rows {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 16px 22px;
        align-items: baseline;
        text-align: left;
      }
      .rows .eyebrow {
        margin: 0;
        text-align: right;
      }
      .rows .typed {
        font: 400 30px/1.4 var(--serif);
        color: var(--faint);
      }
      .rows .typed b {
        font-weight: 400;
        color: var(--sub);
        text-decoration: underline wavy;
        text-decoration-thickness: 1.2px;
        text-underline-offset: 6px;
        text-decoration-color: rgb(215 0 21 / 0.45);
      }
      .rows .got {
        font: 400 30px/1.4 var(--serif);
        color: var(--body);
      }
      .rows .got .w {
        text-underline-offset: 6px;
      }
    </style>
  </head>
  <body>
    <canvas class="layer" id="band"></canvas>
    <div class="content" id="content"></div>
    <script>
      const fixed = (word, spelling) => `<span class="w${spelling ? " sp" : ""}">${word}</span>`;
      const VARIANTS = {
        // tinyfix: a sentence with three wrong words and one misspelling, then what the app turns it into.
        "tinyfix-example": `<div class="rows"><span class="eyebrow">You type</span><span class="typed">I got a letter <b>form</b> the bank. <b>Their</b> is a problem,<br>and I am <b>to</b> tired to <b>recieve</b> it.</span>
    <span class="eyebrow">You get</span><span class="got">I got a letter ${fixed("from")} the bank. ${fixed("There")} is a problem,<br>and I am ${fixed("too")} tired to ${fixed("receive", true)} it.</span></div>`,
        // tinynext: the start of a sentence, then the gray words it offers.
        "tinynext-example": `<div class="rows"><span class="eyebrow">You type</span><span class="typed solid">Please accept my resignation.<br>I will be o<span class="caret"></span></span>
    <span class="eyebrow">You get</span><span class="got">Please accept my resignation.<br>I will be o<span class="ghost">ut of the office</span><span class="key">tab</span></span></div>`,
      };
      document.getElementById("content").innerHTML = VARIANTS[new URLSearchParams(location.search).get("id")];
      // A thin dithered band along the bottom edge, as on the other brand images.
      document.fonts.ready.then(() => {
        dither(
          document.getElementById("band"),
          (ctx, g) => {
            paintField(
              ctx,
              g,
              (u, v, px, py) =>
                smoothstep(0.8, 1, v) *
                (0.5 + 0.3 * Math.sin(px / 38 + Math.sin(py / 60) * 2.2) + 0.2 * Math.sin(py / 26 - px / 90)) *
                0.9,
            );
          },
          { cell: 3, supersample: 1, gap: 0.7, color: "#3a3a3c" },
        );
        window.__ready = true;
      });
    </script>
  </body>
</html>
