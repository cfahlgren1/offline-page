<!doctype html><html><head><meta charset="utf-8"><script src="dither.js"></script><link rel="stylesheet" href="brand.css"><style>
.content{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 48px 8px}
.name{font-weight:700;letter-spacing:-.05em;line-height:1}
/* The second half of each name hints at what it does: .page is the paper, fix is a corrected word, next is a suggestion. */
.name .write{font-family:var(--serif);font-weight:500;letter-spacing:-.02em;margin-left:.02em}
.name .page{font-style:italic;color:var(--ink)}
.name .fix{color:#7b1fe0;text-decoration:underline;text-decoration-thickness:.055em;text-underline-offset:.13em;text-decoration-color:rgb(123 31 224 / .55)}
.name .next{color:#a1a1a6}
.name .caret{display:inline-block;width:.045em;height:.82em;background:#0066cc;vertical-align:-.04em;margin:0 .03em 0 .05em;border-radius:1px}
.line{color:var(--sub);letter-spacing:-.01em;margin-top:18px}
</style></head><body>
<canvas class="layer" id="band"></canvas>
<div class="content"><div class="name" id="name"></div><div class="line" id="line"></div></div>
<script>
// One template for every brand image: a centered name and one line over a dithered wave field. Mono, light.
const IMAGES = {
  banner:   { name: 'offline<span class="write page">.page</span>', line: "Autocorrect and autocomplete that work in airplane mode.", size: 88 },
  social:   { name: 'offline<span class="write page">.page</span>', line: "Writes with you, even in airplane mode.", size: 76 },
  og:       { name: 'offline<span class="write page">.page</span>', line: "Writes with you, even in airplane mode.", size: 76 },
  tinyfix:  { name: 'tiny<span class="write fix">fix</span>', line: "Autocorrect that reads both sides of a word.", size: 104 },
  tinynext: { name: 'tiny<span class="caret"></span><span class="write next">next</span>', line: "Suggests the next few words. Tab to take them.", size: 104 },
};
const params = new URLSearchParams(location.search);
const id = params.get("id");
// The brand is mono. Optional ?accent=RRGGBB tries another color.
const accent = params.get("accent") ? `#${params.get("accent")}` : null;
document.documentElement.style.setProperty("--purple", accent ?? (location.hash === "#dark" ? "#d1d1d6" : "#3a3a3c"));
const image = IMAGES[id];
const name = document.getElementById("name");
name.innerHTML = image.name;
name.style.fontSize = `${image.size}px`;
const line = document.getElementById("line");
line.textContent = image.line;
line.style.fontSize = `${Math.round(image.size * 0.22)}px`;

// The wave field from the tinyfix image, shifted per image so each one is its own but they read as a family.
const PHASE = { banner: 0, social: 1.7, og: 1.7, tinyfix: 0, tinynext: 3.1 };
const waves = (px, py, phase) => {
  const a = Math.sin(px / 38 + Math.sin(py / 60 + phase) * 2.2 + phase);
  const b = Math.sin(py / 26 - px / 90 + Math.cos(px / 140 - phase) * 1.5);
  return 0.5 + 0.32 * a + 0.22 * b;
};

document.fonts.ready.then(() => {
  const { width: w, height: h } = document.body.getBoundingClientRect();
  dither(document.getElementById("band"), (ctx, g) => {
    paintField(ctx, g, (u, v, px, py) => {
      const d = Math.hypot((u - 0.5) / 0.4, (v - 0.48) / 0.31);
      const clear = smoothstep(0.8, 1.45, d);
      return waves(px, py, PHASE[id]) * clear * 0.85;
    });
  }, { cell: 3, supersample: 1, gap: 0.7, color: accent ?? (theme === "dark" ? "#d1d1d6" : "#3a3a3c") });
  window.__ready = true;
});
</script>
</body></html>
