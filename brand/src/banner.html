<!doctype html><html><head><meta charset="utf-8"><script src="dither.js"></script><script src="wifi.js"></script><link rel="stylesheet" href="brand.css"><style>
.content{display:grid;grid-template-columns:440px 1fr;align-items:center;padding:0 0 0 56px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.wordmark{font-size:22px;font-weight:700;letter-spacing:-.025em}.wordmark em{font-style:normal;color:var(--faint)}
h1{font-size:44px;font-weight:700;letter-spacing:-.045em;line-height:1.02;margin-bottom:24px}
.art{position:relative;height:100%}
.card{position:absolute;left:0;bottom:34px;width:390px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 22px;font-family:var(--serif);font-size:17px;line-height:1.65;color:var(--body)}
.card .row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.card .row i{width:6px;height:6px;border-radius:50%;background:#34c759}
.ghost{color:var(--ghost)}
.card .key{font-size:10px;padding:0 6px;margin-left:6px;vertical-align:2px}
</style></head><body>
<canvas class="layer" id="wifi"></canvas>
<div class="content">
  <div>
    <div class="top"><img class="mark" src="../marks/offline-page.svg" width="36" height="36"><span class="wordmark">offline<em>.page</em></span></div>
    <h1>Autocorrect and autocomplete that work in airplane mode.</h1>
    <div class="specs"><span><b>3</b> MB of models</span><span><b>~3</b> ms per fix</span><span><b>0</b> servers</span></div>
  </div>
  <div class="art">
    <div class="card">
      <div class="row"><i></i>Wi‑Fi off · still working</div>
      I got a letter <span class="fixed">from</span> the bank. I will <span style="white-space:nowrap">be o<span class="caret"></span><span class="ghost">ut of</span><span class="key">tab</span></span>
    </div>
  </div>
</div>
<script>
document.fonts.ready.then(() => {
  const dark = theme === "dark";
  dither(document.getElementById("wifi"), (ctx, g) => {
    paintWifi(ctx, g.x(790), g.x(238), g.x(200), [0.95, 0.75, 0.5, 0.26, 0.1]);
    ctx.strokeStyle = "#fff"; ctx.lineCap = "round"; ctx.lineWidth = g.x(9);
    ctx.beginPath(); ctx.moveTo(g.x(700), g.x(52)); ctx.lineTo(g.x(880), g.x(250)); ctx.stroke();
  }, { cell: 4, gap: 0.8, color: dark ? "#a36af5" : "#8a3df0" });
  window.__ready = true;
});
</script>
</body></html>
