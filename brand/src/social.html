<!doctype html><html><head><meta charset="utf-8"><script src="dither.js"></script><script src="wifi.js"></script><link rel="stylesheet" href="brand.css"><style>
.content{display:flex;flex-direction:column;justify-content:center;padding:0 44px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.wordmark{font-size:19px;font-weight:700;letter-spacing:-.025em}.wordmark em{font-style:normal;color:var(--faint)}
h1{font-size:46px;font-weight:700;letter-spacing:-.045em;line-height:1;margin-bottom:22px}
.line{font-family:var(--serif);font-size:19px;color:var(--body)}
.ghost{color:var(--ghost)}
.line .key{font-size:10px;padding:0 6px;margin-left:6px;vertical-align:2px}
.specs{margin-top:22px}
</style></head><body>
<canvas class="layer" id="wifi"></canvas>
<div class="content">
  <div class="top"><img class="mark" src="../marks/offline-page.svg" width="32" height="32"><span class="wordmark">offline<em>.page</em></span></div>
  <h1>Writes with you,<br>even in<br>airplane mode.</h1>
  <div class="line">a letter <span class="fixed">from</span> the bank. I will be o<span class="caret"></span><span class="ghost">ut of</span><span class="key">tab</span></div>
  <div class="specs"><span><b>tinyfix</b> 2.1 MB</span><span><b>tinynext</b> 1 MB</span><span><b>0</b> servers</span></div>
</div>
<script>
document.fonts.ready.then(() => {
  const dark = theme === "dark";
  dither(document.getElementById("wifi"), (ctx, g) => {
    paintWifi(ctx, g.x(520), g.x(250), g.x(200), [0.9, 0.7, 0.45, 0.22, 0.09]);
    ctx.strokeStyle = "#fff"; ctx.lineCap = "round"; ctx.lineWidth = g.x(9);
    ctx.beginPath(); ctx.moveTo(g.x(430), g.x(70)); ctx.lineTo(g.x(610), g.x(270)); ctx.stroke();
  }, { cell: 4, gap: 0.8, color: dark ? "#9b5cf0" : "#8a3df0" });
  window.__ready = true;
});
</script>
</body></html>
