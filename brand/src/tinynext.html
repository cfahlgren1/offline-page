<!doctype html><html><head><meta charset="utf-8"><script src="dither.js"></script><link rel="stylesheet" href="brand.css"><style>
.content{display:grid;grid-template-columns:400px 1fr;align-items:center;padding:0 0 0 56px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.name{font-size:76px;font-weight:700;letter-spacing:-.05em;line-height:.9}
.desc{font-size:18px;line-height:1.4;color:var(--sub);margin:16px 0 26px;max-width:300px}
.foot{font-size:13px;color:var(--faint);margin-top:14px}
.phrase{font-family:var(--serif);font-size:76px;letter-spacing:-.01em;line-height:1;white-space:nowrap;color:var(--ink)}
.under{display:flex;align-items:center;gap:12px;margin-top:30px}
</style></head><body>
<canvas class="layer" id="glow"></canvas><canvas class="layer" id="text"></canvas>
<div class="content">
  <div>
    <div class="top"><img class="mark" src="../marks/tinynext.svg" width="40" height="40"><span class="eyebrow">offline.page · model 02</span></div>
    <div class="name">tinynext</div>
    <div class="desc">Suggests the next few words in gray. Tab to take them.</div>
    <div class="specs"><span><b>944K</b> params</span><span><b>0.98</b> MB</span><span><b>~4</b> ms</span></div>
    <div class="foot">Trained on office email, so it writes like a memo.</div>
  </div>
  <div>
    <div class="phrase">be o<span class="caret" id="caret"></span></div>
    <div class="under"><span class="key">tab</span><span class="eyebrow">shown when ≥ 50% sure</span></div>
  </div>
</div>
<script>
document.fonts.ready.then(() => {
  const dark = theme === "dark";
  dither(document.getElementById("glow"), (ctx, g) => {
    ctx.fillStyle = glow(ctx, g.width * 1.02, g.height * 1.3, g.width * 0.45, dark ? 0.5 : 0.36);
    ctx.fillRect(0, 0, g.width, g.height);
  }, { cell: 4, supersample: 1, color: dark ? "#3d2266" : "#d6c3f2" });

  const caret = document.getElementById("caret").getBoundingClientRect();
  dither(document.getElementById("text"), (ctx, g) => {
    const x = g.x(caret.right + 3), baseline = g.x(caret.bottom - 76 * 0.16);
    ctx.font = `${g.x(76)}px "Iowan Old Style", Georgia, serif`;
    const width = ctx.measureText("ut of the office").width;
    ctx.fillStyle = fade(ctx, x, 0, x + width, 0, [[0, 1], [0.2, 0.85], [0.7, 0.18], [1, 0]]);
    ctx.fillText("ut of the office", x, baseline);
  }, { cell: 2.5, gap: 0.5, color: dark ? "#d1d1d6" : "#6e6e73" });
  window.__ready = true;
});
</script>
</body></html>
